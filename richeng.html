<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>今日日程</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e7f6ff;
      --muted: #b7d7ea;
      --line: rgba(126, 231, 255, 0.28);
      --accent: #7ee7ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background-color: #0c2344;
      background-image:
        linear-gradient(rgba(94, 196, 255, 0.16) 1px, transparent 1px),
        linear-gradient(90deg, rgba(94, 196, 255, 0.16) 1px, transparent 1px);
      background-size: 22px 22px;
      min-height: 100vh;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(320px, 420px) 1fr;
      gap: 20px;
      padding: 20px;
      max-width: 1480px;
      margin: 0 auto;
      align-items: start;
    }

    .panel {
      min-width: 0;
      background:
        linear-gradient(#7ee7ff, #7ee7ff) left top / 14px 2px no-repeat,
        linear-gradient(#7ee7ff, #7ee7ff) left top / 2px 14px no-repeat,
        linear-gradient(#7ee7ff, #7ee7ff) right top / 14px 2px no-repeat,
        linear-gradient(#7ee7ff, #7ee7ff) right top / 2px 14px no-repeat,
        linear-gradient(#7ee7ff, #7ee7ff) left bottom / 14px 2px no-repeat,
        linear-gradient(#7ee7ff, #7ee7ff) left bottom / 2px 14px no-repeat,
        linear-gradient(#7ee7ff, #7ee7ff) right bottom / 14px 2px no-repeat,
        linear-gradient(#7ee7ff, #7ee7ff) right bottom / 2px 14px no-repeat,
        rgba(8, 28, 58, 0.92);
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 16px;
      position: sticky;
      top: 16px;
      max-height: calc(100vh - 32px);
      overflow: auto;
    }

    .home {
      display: inline-block;
      margin-bottom: 10px;
      color: var(--accent);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-decoration: none;
    }

    .home:hover { color: #fff; }

    h1 {
      margin: 0 0 4px;
      font-size: 1.35rem;
      letter-spacing: 0.08em;
      font-weight: 560;
    }

    .sub, .hint, .tip, .warn, .empty {
      margin: 0;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.55;
    }

    .sub { margin-bottom: 4px; }

    .hint, .warn {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 2px;
    }

    .hint {
      background: rgba(4, 16, 36, 0.45);
      border: 1px solid rgba(126, 231, 255, 0.2);
    }

    .warn {
      margin-top: 10px;
      background: rgba(80, 32, 8, 0.45);
      color: #ffc48a;
      border: 1px solid rgba(255, 180, 100, 0.35);
    }

    .warn:empty { display: none; }

    .hint button {
      margin-left: 6px;
      padding: 2px 8px;
      font-size: 0.72rem;
      vertical-align: baseline;
    }

    .field {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin: 12px 0 6px;
    }

    select, input[type="text"], input[type="date"], input[type="time"] {
      width: 100%;
      min-width: 0;
      font: inherit;
      font-size: 0.92rem;
      border: 1px solid rgba(126, 231, 255, 0.35);
      border-radius: 2px;
      padding: 8px 10px;
      background: rgba(4, 16, 36, 0.65);
      color: var(--ink);
    }

    select, input[type="date"], input[type="time"] {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    input::placeholder { color: #7fa3bb; }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btns {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .btns.tight { margin-top: 8px; }

    button {
      border: 1px solid rgba(126, 231, 255, 0.45);
      border-radius: 2px;
      padding: 9px 12px;
      cursor: pointer;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      letter-spacing: 0.06em;
      font-size: 0.82rem;
      background: transparent;
      color: var(--ink);
    }

    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent);
      color: #062033;
      border-color: var(--accent);
      flex: 1.2;
    }

    .btn-secondary { background: transparent; color: var(--ink); flex: 1; }
    .btn-primary:hover { filter: brightness(1.06); }
    .btn-secondary:hover, button:hover:not(:disabled) { border-color: var(--accent); }
    .btn-primary:hover { border-color: var(--accent); }

    .tip { margin-top: 12px; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    #list { margin-top: 4px; min-width: 0; max-width: 100%; }

    .item {
      margin-top: 8px;
      padding: 8px;
      border: 1px solid var(--line);
      background: rgba(4, 16, 36, 0.35);
      min-width: 0;
      max-width: 100%;
    }

    .item.bad { border-color: rgba(255, 180, 100, 0.65); }

    .item-top, .item-mid {
      display: grid;
      gap: 6px;
      align-items: center;
    }

    .item-top { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); }

    .item-mid {
      grid-template-columns: 84px minmax(0, 1fr);
      margin-top: 6px;
    }

    .item-actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .item input, .item select { padding: 6px 8px; font-size: 0.85rem; }

    .to { color: var(--muted); text-align: center; }

    .mini {
      width: auto;
      padding: 6px 8px;
      font-size: 0.75rem;
    }

    .preview { min-width: 0; overflow-x: auto; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .toolbar .stat { color: var(--muted); font-size: 0.85rem; }

    .pages {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page {
      width: 210mm;
      height: 297mm;
      background: #fff;
      color: #111;
      border: 1px solid rgba(255, 255, 255, 0.55);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.38);
      padding: 10mm 12mm 8mm;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sheet-head,
    .meta,
    .picks,
    .tail,
    .foot { flex-shrink: 0; }

    .sheet-head h2 {
      margin: 0;
      text-align: center;
      font-size: 26px;
      letter-spacing: 0.38em;
      text-indent: 0.38em;
      font-weight: 700;
    }

    .dline {
      height: 4px;
      border-top: 2.5px solid #1a1a1a;
      border-bottom: 1px solid #1a1a1a;
      margin: 6px 0 8px;
    }

    .meta {
      display: grid;
      grid-template-columns: 1.05fr 1.15fr 1.5fr 0.85fr;
      gap: 3mm;
      font-size: 14px;
      margin-bottom: 3mm;
    }

    .meta span {
      display: flex;
      align-items: flex-end;
      gap: 1.5mm;
      min-width: 0;
      white-space: nowrap;
    }

    .meta b { font-weight: 500; }

    .meta i {
      flex: 1;
      min-width: 0;
      min-height: 1.15em;
      border-bottom: 1px solid #222;
      font-style: normal;
      font-weight: 650;
      padding: 0 0.5mm 1px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .picks {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1.5mm 3.5mm;
      margin: 0 0 3.5mm;
      padding: 1.6mm 0;
      border-top: 1px solid #ddd;
      border-bottom: 1px solid #ddd;
      font-size: 13px;
    }

    .picks .lab { font-weight: 650; }
    .picks .sp { width: 4mm; }

    .slots {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .grid {
      width: 100%;
      height: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      border: 1.6px solid #1a1a1a;
      --cat: transparent;
    }

    .grid th,
    .grid td {
      border: 1px solid #d5d5d5;
      padding: 0 2mm;
      vertical-align: middle;
      font-weight: 400;
    }

    .grid th {
      height: 7.5mm;
      font-size: 12px;
      letter-spacing: 0.14em;
      font-weight: 650;
      text-align: center;
      color: #333;
      border-bottom: 1.6px solid #1a1a1a;
    }

    .grid col.period { width: 16mm; }
    .grid col.when { width: 34mm; }

    td.period {
      text-align: center;
      font-weight: 700;
      letter-spacing: 0.16em;
      font-size: 15px;
      border-right: 1.5px solid #1a1a1a;
      background: #f7f7f7;
    }

    td.period.am { color: #163e75; background: #e7f2fb; }
    td.period.noon { color: #8a5a00; background: #fff4df; }
    td.period.pm { color: #14663c; background: #e7f6ee; }
    td.period.night { color: #53447a; background: #f3eef8; }

    td.when {
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 16px;
      letter-spacing: -0.03em;
      color: #222;
      white-space: nowrap;
      border-right: 1.5px solid #1a1a1a;
    }

    td.life { --cat: #1d5f8a; }
    td.meal { --cat: #8a5a00; }
    td.study { --cat: #163e75; }
    td.sport { --cat: #14663c; }
    td.play { --cat: #8d3d2f; }
    td.rest { --cat: #53447a; }

    .event-in {
      display: flex;
      align-items: center;
      gap: 2mm;
      min-width: 0;
      min-height: 6mm;
    }

    .tag {
      flex: 0 0 auto;
      font-size: 11px;
      letter-spacing: 0.12em;
      font-weight: 650;
      color: var(--cat);
    }

    .what {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 18px;
    }

    .hand {
      display: inline-block;
      width: 22mm;
      border-bottom: 1px solid #cfcfcf;
      vertical-align: middle;
    }

    .hand.wide { width: auto; flex: 1; margin-right: 4mm; }

    .check {
      width: 4.4mm;
      height: 4.4mm;
      margin-left: auto;
      flex: 0 0 auto;
      border: 1.5px solid #222;
    }

    .tail {
      flex: 0 0 auto;
      margin-top: 3.5mm;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.4mm 6mm;
    }

    .tail .wide { grid-column: 1 / -1; }

    .tail h3 {
      margin: 0 0 1.2mm;
      font-size: 13px;
      letter-spacing: 0.14em;
      font-weight: 650;
    }

    .line {
      border-bottom: 1px solid #222;
      min-height: 7mm;
      font-size: 15px;
      line-height: 1.35;
    }

    .sign {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      gap: 8mm;
      margin-top: 1mm;
      font-size: 13px;
    }

    .sign b {
      display: inline-block;
      width: 36mm;
      border-bottom: 1px solid #222;
      transform: translateY(-1px);
    }

    .foot {
      flex: 0 0 auto;
      margin: 2mm 0 0;
      text-align: center;
      color: #888;
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .page.crowded .sheet-head h2 { font-size: 22px; }
    .page.crowded .line { min-height: 6mm; }
    .page.crowded .picks { margin-bottom: 2mm; padding: 1mm 0; }
    .page.crowded .what { font-size: 13.5px; }
    .page.crowded td.when { font-size: 11px; }
    .page.crowded td.period { font-size: 13px; }

    .grid, .grid th, .grid td {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .page.crowded .foot { margin-top: 1mm; }

    @media (max-width: 980px) {
      .app { grid-template-columns: minmax(0, 1fr); }
      .panel { position: static; max-height: none; }
      .pages { align-items: flex-start; }
      .item-actions { justify-content: flex-start; }
    }

    @page { size: A4; margin: 0; }

    @media print {
      body { background: #fff !important; color: #111; color-scheme: light; }
      .no-print { display: none !important; }
      .app { display: block; padding: 0; max-width: none; }
      .preview { overflow: visible; }
      .pages { gap: 0; }
      .page {
        border: none;
        box-shadow: none;
        margin: 0;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="panel no-print">
      <a class="home" href="index.html">全部工具</a>
      <h1>今日日程</h1>
      <p class="sub">给小学生排好一天。左侧填写，右侧预览，直接打印成 A4。</p>

      <div class="row">
        <div>
          <label class="field" for="name">姓名</label>
          <input id="name" type="text" maxlength="8" placeholder="小朋友的名字" autocomplete="name" />
        </div>
        <div>
          <label class="field" for="klass">班级</label>
          <input id="klass" type="text" maxlength="10" placeholder="例如三年级2班" autocomplete="off" />
        </div>
      </div>
      <div class="row">
        <div>
          <label class="field" for="date">日期</label>
          <input id="date" type="date" />
        </div>
        <div>
          <label class="field" for="title">标题</label>
          <input id="title" type="text" maxlength="10" autocomplete="off" />
        </div>
      </div>
      <p class="hint" id="date-hint" hidden>这份日期不是今天。<button type="button" id="btn-today">改成今天</button></p>

      <label class="field" for="goal">今日目标</label>
      <input id="goal" type="text" maxlength="24" placeholder="例如：认真完成作业" autocomplete="off" />

      <div class="btns">
        <button type="button" class="btn-primary" id="btn-print">打印</button>
      </div>
      <p class="tip">打印时选 A4 纵向，边距选「无」，并关掉页眉页脚。右边的方框留给小朋友打勾。</p>

      <p class="field">安排</p>
      <div class="btns tight">
        <button type="button" class="btn-secondary" id="btn-add">添加一项</button>
        <button type="button" class="btn-secondary" id="btn-sort">按时间排序</button>
      </div>
      <div class="btns tight">
        <button type="button" id="btn-school">填入上学日</button>
        <button type="button" id="btn-weekend">填入周末</button>
        <button type="button" id="btn-clear">清空</button>
      </div>
      <div id="list" aria-label="安排列表"></div>
      <p class="warn" id="warn"></p>
    </aside>

    <main class="preview">
      <div class="toolbar no-print">
        <span class="stat" id="stat" aria-live="polite"></span>
        <button type="button" id="btn-print-2">打印</button>
      </div>
      <div class="pages">
        <article class="page" id="page" aria-label="日程预览"></article>
      </div>
    </main>
  </div>

  <script>
    (function () {
      var KEY = "magic-richeng-v1";
      var MIN_ROWS = 12;
      var CATS = [
        { id: "life", label: "生活" },
        { id: "meal", label: "用餐" },
        { id: "study", label: "学习" },
        { id: "sport", label: "运动" },
        { id: "play", label: "玩耍" },
        { id: "rest", label: "休息" }
      ];
      var PRESETS = {
        school: [
          ["06:40", "07:00", "起床、洗漱", "life"],
          ["07:00", "07:20", "吃早餐", "meal"],
          ["07:30", "07:50", "出门上学", "life"],
          ["08:00", "11:30", "上午上课", "study"],
          ["11:40", "12:20", "午餐", "meal"],
          ["12:30", "13:40", "午休", "rest"],
          ["13:50", "16:10", "下午上课", "study"],
          ["16:10", "16:40", "放学回家", "life"],
          ["16:50", "17:30", "户外活动", "sport"],
          ["18:00", "18:30", "吃晚餐", "meal"],
          ["18:40", "20:00", "作业、阅读", "study"],
          ["20:10", "21:00", "洗漱、睡觉", "rest"]
        ],
        weekend: [
          ["07:30", "08:00", "起床、洗漱", "life"],
          ["08:00", "08:30", "吃早餐", "meal"],
          ["09:00", "09:40", "阅读", "study"],
          ["10:00", "11:20", "户外运动", "sport"],
          ["11:40", "12:20", "午餐", "meal"],
          ["12:30", "14:00", "午休", "rest"],
          ["14:30", "16:00", "兴趣或玩耍", "play"],
          ["18:00", "18:40", "吃晚餐", "meal"],
          ["19:00", "19:40", "和家人在一起", "play"],
          ["20:30", "21:00", "洗漱、睡觉", "rest"]
        ]
      };

      var seq = 1;
      var els = {
        name: document.getElementById("name"),
        klass: document.getElementById("klass"),
        date: document.getElementById("date"),
        title: document.getElementById("title"),
        goal: document.getElementById("goal"),
        dateHint: document.getElementById("date-hint"),
        list: document.getElementById("list"),
        warn: document.getElementById("warn"),
        stat: document.getElementById("stat"),
        page: document.getElementById("page")
      };
      var state = loadState();

      function uid() { return "i" + (seq++); }

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      }

      function pad(n) { return String(n).padStart(2, "0"); }

      function todayISO() {
        var t = new Date();
        return t.getFullYear() + "-" + pad(t.getMonth() + 1) + "-" + pad(t.getDate());
      }

      function formatDate(iso) {
        var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
        if (!m) return { dateText: "", week: "" };
        var y = Number(m[1]);
        var mo = Number(m[2]);
        var d = Number(m[3]);
        var dt = new Date(y, mo - 1, d);
        if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) {
          return { dateText: "", week: "" };
        }
        var weeks = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
        return { dateText: y + "年" + mo + "月" + d + "日", week: weeks[dt.getDay()] };
      }

      function str(v) { return typeof v === "string" ? v : ""; }

      function catById(id) {
        for (var i = 0; i < CATS.length; i++) if (CATS[i].id === id) return CATS[i];
        return CATS[0];
      }

      function isDefaultTitle(title) {
        return title === "今日日程" || title === "日程安排" || title === "";
      }

      function suggestedTitle(iso) {
        return iso === todayISO() ? "今日日程" : "日程安排";
      }

      function badTime(item) {
        return !!(item.start && item.end && item.end <= item.start);
      }

      function formatSpan(item) {
        if (item.start && item.end) return item.start + "–" + item.end;
        return item.start || item.end || "";
      }

      function addMinutes(hhmm, mins) {
        var parts = String(hhmm || "").split(":");
        var h = Number(parts[0]);
        var m = Number(parts[1]);
        if (!isFinite(h) || !isFinite(m)) return "";
        var total = ((h * 60 + m + mins) % 1440 + 1440) % 1440;
        return pad(Math.floor(total / 60)) + ":" + pad(total % 60);
      }

      function makeItem(start, end, title, cat) {
        return { id: uid(), start: start || "", end: end || "", title: title || "", cat: catById(cat).id };
      }

      function presetItems(key) {
        return PRESETS[key].map(function (row) {
          return makeItem(row[0], row[1], row[2], row[3]);
        });
      }

      function normalizeItem(raw) {
        raw = raw || {};
        return makeItem(str(raw.start), str(raw.end), str(raw.title), str(raw.cat));
      }

      function hasContent() {
        return state.items.some(function (it) {
          return it.title.trim() || it.start || it.end;
        });
      }

      function load() {
        try {
          var raw = localStorage.getItem(KEY);
          if (!raw) return null;
          var data = JSON.parse(raw);
          if (!data || !Array.isArray(data.items)) return null;
          return data;
        } catch (e) {
          return null;
        }
      }

      function loadState() {
        var data = load();
        if (!data) {
          return {
            name: "",
            klass: "",
            date: todayISO(),
            title: "今日日程",
            goal: "",
            items: presetItems("school")
          };
        }
        return {
          name: str(data.name).slice(0, 8),
          klass: str(data.klass).slice(0, 10),
          date: /^\d{4}-\d{2}-\d{2}$/.test(data.date) ? data.date : todayISO(),
          title: str(data.title).slice(0, 10) || "今日日程",
          goal: str(data.goal).slice(0, 24),
          items: data.items.map(normalizeItem)
        };
      }

      function save() {
        try {
          localStorage.setItem(KEY, JSON.stringify({
            name: state.name,
            klass: state.klass,
            date: state.date,
            title: state.title,
            goal: state.goal,
            items: state.items.map(function (it) {
              return { start: it.start, end: it.end, title: it.title, cat: it.cat };
            })
          }));
        } catch (e) { /* ignore quota / private mode */ }
      }

      function updateDateHint() {
        els.dateHint.hidden = !state.date || state.date === todayISO();
      }

      function setDate(iso, retitle) {
        state.date = iso;
        els.date.value = iso;
        if (retitle && isDefaultTitle(state.title)) {
          state.title = suggestedTitle(iso);
          els.title.value = state.title;
        }
        updateDateHint();
        save();
        renderSheet();
      }

      function fieldInput(type, field, label) {
        var node = document.createElement("input");
        node.type = type;
        node.dataset.field = field;
        node.setAttribute("aria-label", label);
        node.autocomplete = "off";
        if (type === "text") node.maxLength = 24;
        return node;
      }

      function mini(act, label, text) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "mini";
        btn.dataset.act = act;
        btn.setAttribute("aria-label", label);
        btn.textContent = text;
        return btn;
      }

      function itemEditor(item, index) {
        var box = el("div", "item" + (badTime(item) ? " bad" : ""));
        box.dataset.id = item.id;

        var top = el("div", "item-top");
        var start = fieldInput("time", "start", "开始时间");
        start.value = item.start;
        var end = fieldInput("time", "end", "结束时间");
        end.value = item.end;
        var sel = document.createElement("select");
        sel.dataset.field = "cat";
        sel.setAttribute("aria-label", "类型");
        CATS.forEach(function (cat) {
          var opt = document.createElement("option");
          opt.value = cat.id;
          opt.textContent = cat.label;
          sel.append(opt);
        });
        sel.value = item.cat;
        top.append(start, el("span", "to", "–"), end);

        var mid = el("div", "item-mid");
        var title = fieldInput("text", "title", "事件");
        title.placeholder = "这件事做什么";
        title.value = item.title;
        mid.append(sel, title);

        var actions = el("div", "item-actions");
        var up = mini("up", "上移", "上移");
        var down = mini("down", "下移", "下移");
        var del = mini("del", "删除", "删除");
        up.disabled = index === 0;
        down.disabled = index === state.items.length - 1;
        actions.append(up, down, del);

        box.append(top, mid, actions);
        return box;
      }

      function renderList() {
        els.list.replaceChildren();
        if (!state.items.length) {
          els.list.append(el("p", "empty", "还没有安排。可以添加一项，或填入上学日、周末。"));
          return;
        }
        state.items.forEach(function (item, index) {
          els.list.append(itemEditor(item, index));
        });
      }

      var PERIOD_CLASS = { "上午": "am", "中午": "noon", "下午": "pm", "晚上": "night" };

      function periodOf(item) {
        var t = item.start || item.end || "";
        var m = /^(\d{2}):(\d{2})$/.exec(t);
        if (!m) return "";
        var mins = Number(m[1]) * 60 + Number(m[2]);
        if (mins < 11 * 60 + 30) return "上午";
        if (mins < 13 * 60 + 30) return "中午";
        if (mins < 18 * 60) return "下午";
        return "晚上";
      }

      function markSpans(model, key) {
        var i = 0;
        while (i < model.length) {
          var value = model[i][key];
          var span = 1;
          if (value) {
            while (i + span < model.length && model[i + span][key] === value) span++;
          }
          model[i][key + "Show"] = true;
          model[i][key + "Span"] = span;
          for (var k = 1; k < span; k++) model[i + k][key + "Show"] = false;
          i += span;
        }
      }

      function sheetModel(count) {
        var model = [];
        for (var i = 0; i < count; i++) {
          var item = state.items[i] || null;
          model.push({
            item: item,
            period: item ? periodOf(item) : "",
            time: item ? formatSpan(item) : ""
          });
        }
        markSpans(model, "period");
        markSpans(model, "time");
        return model;
      }

      function eventCell(item) {
        var td = el("td", "event" + (item ? " " + catById(item.cat).id : ""));
        var inner = el("div", "event-in");
        if (item) inner.append(el("span", "tag", catById(item.cat).label));
        var title = item ? item.title.trim() : "";
        if (title) {
          var what = el("span", "what", title);
          what.title = title;
          inner.append(what);
        } else {
          inner.append(el("span", "hand wide"));
        }
        inner.append(el("span", "check"));
        td.append(inner);
        return td;
      }

      function sheetTable(count) {
        var table = el("table", "grid");
        table.style.setProperty("--rows", String(count));
        var cols = el("colgroup");
        cols.append(el("col", "period"), el("col", "when"), el("col", "event"));
        var thead = el("thead");
        var hr = el("tr");
        ["时段", "时间", "安排"].forEach(function (label) { hr.append(el("th", "", label)); });
        thead.append(hr);
        var body = el("tbody");
        sheetModel(count).forEach(function (row) {
          var tr = el("tr");
          if (row.periodShow) {
            var period = el("td", "period" + (PERIOD_CLASS[row.period] ? " " + PERIOD_CLASS[row.period] : ""));
            if (row.periodSpan > 1) period.rowSpan = row.periodSpan;
            if (row.period) period.textContent = row.period;
            tr.append(period);
          }
          if (row.timeShow) {
            var when = el("td", "when");
            if (row.timeSpan > 1) when.rowSpan = row.timeSpan;
            if (row.time) when.textContent = row.time;
            else when.append(el("span", "hand"));
            tr.append(when);
          }
          tr.append(eventCell(row.item));
          body.append(tr);
        });
        table.append(cols, thead, body);
        return table;
      }

      function metaField(label, value) {
        var span = el("span");
        span.append(el("b", "", label));
        span.append(el("i", "", value || ""));
        return span;
      }

      function block(title, text) {
        var box = el("div", text == null ? "" : "wide");
        box.append(el("h3", "", title));
        box.append(el("div", "line", text || ""));
        return box;
      }

      function renderSheet() {
        var rows = Math.max(state.items.length, MIN_ROWS);
        var page = els.page;
        page.classList.toggle("crowded", rows >= 15);
        page.replaceChildren();

        var dated = formatDate(state.date);
        var head = el("header", "sheet-head");
        head.append(el("h2", "", state.title.trim() || suggestedTitle(state.date)));
        head.append(el("div", "dline"));

        var meta = el("div", "meta");
        meta.append(
          metaField("姓名", state.name.trim()),
          metaField("班级", state.klass.trim()),
          metaField("日期", dated.dateText),
          metaField("星期", dated.week)
        );

        var picks = el("div", "picks");
        ["天气", "○ 晴", "○ 多云", "○ 阴", "○ 雨"].forEach(function (text, i) {
          picks.append(el("span", i === 0 ? "lab" : "opt", text));
        });
        picks.append(el("span", "sp"));
        ["心情", "○ 开心", "○ 一般", "○ 有点累"].forEach(function (text, i) {
          picks.append(el("span", i === 0 ? "lab" : "opt", text));
        });

        var slots = el("div", "slots");
        slots.append(sheetTable(rows));

        var tail = el("section", "tail");
        tail.append(block("今日目标", state.goal.trim()));
        tail.append(block("今天我做到了"));
        tail.append(block("明天想先做"));
        var sign = el("div", "sign");
        ["小朋友签名", "家长签名"].forEach(function (label) {
          var span = el("span", "", label + " ");
          span.append(el("b"));
          sign.append(span);
        });
        tail.append(sign);

        page.append(head, meta, picks, slots, tail, el("p", "foot", "做完一件，就在右边方框里打勾"));

        var blanks = Math.max(0, MIN_ROWS - state.items.length);
        var stat = state.items.length + " 项安排";
        if (!state.items.length) stat = "还没有安排，页上可以手写";
        else if (blanks) stat += "，还有 " + blanks + " 行可以手写";
        else if (state.items.length > 18) stat += "，一页会比较挤";
        els.stat.textContent = stat;
        els.warn.textContent = state.items.some(badTime)
          ? "有一项的结束时间不晚于开始时间，预览里会照原样印出。"
          : "";
      }

      function refresh() {
        save();
        renderList();
        renderSheet();
      }

      function addItem() {
        var last = state.items[state.items.length - 1];
        var start = "08:00";
        var end = "08:30";
        if (last && (last.end || last.start)) {
          start = last.end || addMinutes(last.start, 30);
          end = addMinutes(start, 30);
        }
        var item = makeItem(start, end, "", "life");
        state.items.push(item);
        refresh();
        var node = els.list.querySelector('[data-id="' + CSS.escape(item.id) + '"] [data-field="title"]');
        if (node) {
          node.focus();
          node.scrollIntoView({ block: "nearest" });
        }
      }

      function move(id, dir) {
        var i = state.items.findIndex(function (it) { return it.id === id; });
        var j = i + dir;
        if (i < 0 || j < 0 || j >= state.items.length) return;
        var item = state.items.splice(i, 1)[0];
        state.items.splice(j, 0, item);
        refresh();
      }

      function remove(id) {
        state.items = state.items.filter(function (it) { return it.id !== id; });
        refresh();
      }

      function sortItems() {
        state.items.sort(function (a, b) {
          if (!a.start && !b.start) return 0;
          if (!a.start) return 1;
          if (!b.start) return -1;
          return a.start < b.start ? -1 : a.start > b.start ? 1 : 0;
        });
        refresh();
      }

      function applyPreset(key) {
        if (hasContent() && !confirm("用这份示例替换当前安排？姓名、日期和目标会保留。")) return;
        state.items = presetItems(key);
        refresh();
      }

      function clearItems() {
        if (hasContent() && !confirm("清空全部安排？")) return;
        state.items = [];
        refresh();
      }

      function onEdit(e) {
        var row = e.target.closest(".item");
        if (!row) return;
        var field = e.target.dataset.field;
        if (!field) return;
        var item = state.items.find(function (it) { return it.id === row.dataset.id; });
        if (!item) return;
        item[field] = e.target.value;
        row.classList.toggle("bad", badTime(item));
        save();
        renderSheet();
      }

      function bindText(node, key) {
        node.addEventListener("input", function () {
          state[key] = node.value;
          save();
          renderSheet();
        });
      }

      function fillForm() {
        els.name.value = state.name;
        els.klass.value = state.klass;
        els.date.value = state.date;
        els.title.value = state.title;
        els.goal.value = state.goal;
        updateDateHint();
        renderList();
        renderSheet();
      }

      bindText(els.name, "name");
      bindText(els.klass, "klass");
      bindText(els.title, "title");
      bindText(els.goal, "goal");
      els.date.addEventListener("input", function () { setDate(els.date.value, true); });
      document.getElementById("btn-today").addEventListener("click", function () {
        setDate(todayISO(), true);
      });
      document.getElementById("btn-print").addEventListener("click", function () { window.print(); });
      document.getElementById("btn-print-2").addEventListener("click", function () { window.print(); });
      document.getElementById("btn-add").addEventListener("click", addItem);
      document.getElementById("btn-sort").addEventListener("click", sortItems);
      document.getElementById("btn-school").addEventListener("click", function () { applyPreset("school"); });
      document.getElementById("btn-weekend").addEventListener("click", function () { applyPreset("weekend"); });
      document.getElementById("btn-clear").addEventListener("click", clearItems);
      els.list.addEventListener("input", onEdit);
      els.list.addEventListener("change", onEdit);
      els.list.addEventListener("click", function (e) {
        var btn = e.target.closest("[data-act]");
        if (!btn) return;
        var row = btn.closest(".item");
        if (!row) return;
        var act = btn.dataset.act;
        if (act === "up") move(row.dataset.id, -1);
        else if (act === "down") move(row.dataset.id, 1);
        else if (act === "del") remove(row.dataset.id);
      });

      fillForm();
    })();
  </script>
</body>
</html>
