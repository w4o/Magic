<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自动生成中文字卡片</title>
    <style>
        @page { size: A4; margin: 0; }
        body { margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .controls { 
            position: absolute; 
            top: 10px; 
            left: 10px; 
            background: rgba(255, 255, 255, 0.9); 
            padding: 10px; 
            border-radius: 5px; 
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); 
            display: block; /* 确保输入框可见 */
        }
        .page { display: grid; grid-template-rows: repeat(4, 0fr); grid-template-columns: repeat(3, 1fr); width: 21cm; height: 29.7cm; box-sizing: border-box; page-break-after: always; }
        .card { display: flex; align-items: center; justify-content: center; width: 7cm; height: 7cm; border: 1px dashed #000; box-sizing: border-box; }
        .card span { font-size: 230px; font-family: "KaiTi", "SimSun", serif; text-align: center; }
        @media print {
            .controls { display: none; }
        }
    </style>
</head>
<body>
    <div class="controls">
        <textarea id="textInput" rows="3" cols="50" placeholder="请输入文字..."></textarea>
        <button onclick="createCards()">生成卡片</button>

        <button onclick="createCards();window.print()">一键打印</button>
    </div>
    <div id="cardsContainer"></div>

    <script>
        function createCards() {
            const text = document.getElementById('textInput').value.replace(/\s+/g, '');
            const characters = text.split('');
            const cardsPerPage = 12;
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            
            let currentPage = null;
            characters.forEach((char, index) => {
                if (index % cardsPerPage === 0) {
                    currentPage = document.createElement('div');
                    currentPage.className = 'page';
                    container.appendChild(currentPage);
                }
                const card = document.createElement('div');
                card.className = 'card';
                const span = document.createElement('span');
                span.textContent = char;
                card.appendChild(span);
                currentPage.appendChild(card);
            });
        }
    </script>
</body>
</html>
