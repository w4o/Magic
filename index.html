<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>学习小工具</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f3ec;
      --panel: #fffdf8;
      --ink: #1f1a14;
      --muted: #6b6258;
      --line: #ddd4c5;
      --accent: #8b4513;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at top, #fff9ef 0%, transparent 55%),
        linear-gradient(180deg, #f8f2e6 0%, var(--bg) 100%);
    }

    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 56px 20px 40px;
    }

    header {
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
      letter-spacing: 0.08em;
      color: var(--accent);
      font-weight: 650;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    a.card {
      display: flex;
      flex-direction: column;
      min-height: 220px;
      padding: 22px 20px 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(80, 55, 20, 0.06);
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    a.card:hover,
    a.card:focus-visible {
      transform: translateY(-3px);
      border-color: #c9b89a;
      box-shadow: 0 16px 36px rgba(80, 55, 20, 0.1);
      outline: none;
    }

    .mark {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      margin-bottom: 18px;
      border-radius: 14px;
      background: #f3ebe0;
      color: var(--accent);
      font-size: 1.45rem;
      font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.65;
    }

    .go {
      margin-top: auto;
      padding-top: 18px;
      color: var(--accent);
      font-size: 0.84rem;
      letter-spacing: 0.06em;
    }

    footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    @media (max-width: 760px) {
      .wrap { padding-top: 36px; }
      .grid { grid-template-columns: 1fr; }
      a.card { min-height: 0; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>学习小工具</h1>
      <p class="sub">口算、古诗、识字，在浏览器里排好，再打印。</p>
    </header>

    <nav class="grid" aria-label="工具">
      <a class="card" href="suan-ti.html">
        <span class="mark" aria-hidden="true">算</span>
        <h2>小学生计算题</h2>
        <p>按年级出一份加减乘除口算卷，浏览器里直接打印成 A4。</p>
        <span class="go">打开 →</span>
      </a>
      <a class="card" href="gushi-pinyin.html">
        <span class="mark" aria-hidden="true">诗</span>
        <h2>古诗拼音排版</h2>
        <p>输入古诗，自动注音排版。可调每页首数和单个注音，支持 A4 打印。</p>
        <span class="go">打开 →</span>
      </a>
      <a class="card" href="word-card.html">
        <span class="mark" aria-hidden="true">字</span>
        <h2>中文字卡片</h2>
        <p>输入文字，按页生成大方块汉字卡片，方便裁开使用。</p>
        <span class="go">打开 →</span>
      </a>
    </nav>

    <footer>三个页面都在本机打开，不需要登录。</footer>
  </main>
</body>
</html>
